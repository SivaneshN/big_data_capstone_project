version: "3.9"

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: cinegraph_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (Python driver)
    environment:
      - NEO4J_AUTH=neo4j/<ADD_YOUR_PASSWORD_HERE>
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_dbms_memory_transaction_total_max=0
      - NEO4J_db_memory_transaction_total_max=0
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "<ADD_YOUR_PASSWORD_HERE>", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: cinegraph_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  qdrant_data: